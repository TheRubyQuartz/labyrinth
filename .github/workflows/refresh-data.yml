name: Refresh conservation data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-data.yml']
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: conservation-refresh
  cancel-in-progress: false
jobs:
  refresh:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run refresh:data
      - run: npm run build
      - name: Save updated data and build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/conservation-snapshot.json public/conservation-data.json docs
          if ! git diff --cached --quiet; then
            git commit -m "Refresh sourced conservation observations"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish refreshed website
        id: deployment
        uses: actions/deploy-pages@v4
